name: audit-source-snapshot
on:
  push:
    branches: ['audit/full-review-20261029']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export repository objects only (no credentials, workspace state or models)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit-source"
          git bundle create "$RUNNER_TEMP/audit-source/gstack861.bundle" HEAD
          git -c protocol.version=2 submodule update --init --depth 1
          git -C upstream/gstack bundle create "$RUNNER_TEMP/audit-source/upstream-gstack.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/audit-source/HEAD.txt"
          git ls-files --stage > "$RUNNER_TEMP/audit-source/tracked-files.txt"
          sha256sum "$RUNNER_TEMP/audit-source/"*.bundle > "$RUNNER_TEMP/audit-source/SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: audit-source-snapshot
          path: ${{ runner.temp }}/audit-source/
          retention-days: 3
