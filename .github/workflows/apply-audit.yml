name: apply-reviewed-audit
on:
  push:
    branches: ['audit/full-review-20261029']
    paths: ['.audit-transfer/**', '.github/workflows/apply-audit.yml']
permissions:
  contents: write
jobs:
  apply-exact-tested-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply exact reviewed patch and verify target tree
        shell: bash
        run: |
          set -euo pipefail
          cat .audit-transfer/part-* > "$RUNNER_TEMP/audit.patch.gz"
          echo "5357d38cdaa1c2bbfc7b01968763356d987bca6d0aa7f094cafef2dd713d2292  $RUNNER_TEMP/audit.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/audit.patch.gz" > "$RUNNER_TEMP/audit.patch"
          git apply --check --index "$RUNNER_TEMP/audit.patch"
          git apply --index "$RUNNER_TEMP/audit.patch"
          git rm .github/workflows/apply-audit.yml .audit-transfer/part-*
          test "$(git write-tree)" = 6cad9408fc5c02adfb2525c07445ff62dd18ed46
          git diff --cached --check
      - run: npm run check
      - run: npm test
      - run: npm run verify-offline
      - name: Publish tested source to audit branch (never force)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = 6cad9408fc5c02adfb2525c07445ff62dd18ed46
          # Workflow files are removed separately through the authorized connector;
          # this token only publishes reviewed source, tests and documentation.
          git restore --source=HEAD --staged --worktree .github/workflows/audit-snapshot.yml .github/workflows/apply-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'fix: full-repository audit findings and regression tests (0.4.33)'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/audit/full-review-20261029
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
